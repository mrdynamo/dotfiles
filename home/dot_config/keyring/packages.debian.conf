# Pinned apt packages for the keyring lifecycle on Debian.
#
# The run script home/run_always_after_30-keyring.sh.tmpl installs the entries
# that are missing, with the pinned version. Renovate bumps these versions
# through the deb datasource (.renovate/customManagers.json5).
#
# These are the versions of the release pocket. The security pocket is not
# covered: the deb datasource fetches "Packages.gz" and Debian publishes the
# security pocket as "Packages.xz" only, so a security update for one of
# these packages is not picked up automatically.
#
# gnome-keyring     - the Secret Service daemon that holds the token
# dbus-user-session - the systemd user socket that provides the session bus
# dbus-bin          - provides dbus-send, which talks to the Secret Service
# libsecret-tools   - provides secret-tool, the reference Secret Service client
gnome-keyring=48.0-1
dbus-user-session=1.16.2-2
dbus-bin=1.16.2-2
libsecret-tools=0.21.7-1
